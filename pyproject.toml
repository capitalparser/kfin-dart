[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "kfin-dart"
version = "0.0.1"
description = "Korean DART disclosure parser for auditors and investors — XBRL-aware, audit-traceable, low-token extraction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kim Kyung-jun" },
]
keywords = ["dart", "korean", "audit", "xbrl", "disclosure", "finance", "k-ifrs"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Natural Language :: Korean",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "lxml>=5.0",
    "pydantic>=2.6",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/capitalparser/kfin-dart"
Issues = "https://github.com/capitalparser/kfin-dart/issues"

[tool.maturin]
python-source = "."
module-name = "kfin_dart_rs"
manifest-path = "kfin_dart_rs/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
